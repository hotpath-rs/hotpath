# Per-benchmark workload and upload delay, read by agg-bench/run.sh.
# BENCHES lists the series uploaded by every run.
BENCHES="agg-alpha agg-beta agg-gamma agg-delta"
AGG_CALLS=100
agg_alpha_BYTES=4096
agg_alpha_DELAY=0
agg_beta_BYTES=8192
agg_beta_DELAY=0
agg_gamma_BYTES=16384
agg_gamma_DELAY=0
agg_delta_BYTES=2048
agg_delta_DELAY=0
# Extra delay for runs triggered by a `synchronize` event (used to make an
# older run upload after a newer one).
SYNC_EXTRA_DELAY=0
