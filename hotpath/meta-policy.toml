# Policy for the `meta` benchmark: hotpath profiling a copy of itself.

# A broken budget fails the pull request's check run. Allocation regressions are
# reported without failing it: profiling a copy of itself is not lockstep.
pr_check = "fail"

[functions]
ignore = ["hotpath_drain::EventQueue::drain_into"]
min_percent_total = 0.5

[[functions.budgets]]
match = "hotpath::prometheus_server::handle_request"
alloc = { avg = "51 B", total = "51000 B" }
timing = { "p99.9" = "10 ms" }
calls = { min = 1000 }

[functions.alloc]
judged = true
min_percent_change = 10
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 1
