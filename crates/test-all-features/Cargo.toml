[package]
name = "test-all-features"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests with all feature flags enabled."

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]
hotpath-meta = ["hotpath/hotpath-meta"]
hotpath-alloc-meta = ["hotpath-meta", "hotpath/hotpath-alloc-meta"]
hotpath-cloud-meta = ["hotpath-meta", "hotpath/hotpath-cloud-meta"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]

# Gates the expected-to-fail `duplicate_labels_*` examples; a cfg, not a feature, so
# `--all-features` stays green. Set by `hotpath/tests/unique_labels.rs`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hotpath_dup_labels_fixture)'] }

[dependencies]
hotpath = { path = "../hotpath", features = ["tokio", "axum-0-8", "diesel", "ureq-3"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = "0.8"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
ureq = { version = "3", default-features = false }
