[package]
name = "callgrind-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "POC: are Callgrind per-function instruction counts stable across GitHub runners?"

[dependencies]
hotpath = { path = "../hotpath", features = ["hotpath", "hotpath-cpu", "tokio"] }
memchr = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }

[profile.release]
debug = 0

[workspace]
