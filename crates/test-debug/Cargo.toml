[package]
name = "test-debug"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for debug metrics functionality."

[dependencies]
hotpath = { path = "../hotpath" }
tokio = { version = "1.0", features = ["full"] }

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-meta = ["hotpath/hotpath-meta"]
hotpath-alloc-meta = ["hotpath-meta", "hotpath/hotpath-alloc-meta"]
