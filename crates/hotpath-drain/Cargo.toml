[package]
name = "hotpath-drain"
version = "0.30.3"
edition = "2021"
repository = "https://github.com/hotpath-rs/hotpath"
homepage = "https://hotpath.rs"
description = "Lock-free per-thread event queues with a single drain. Transport layer of the hotpath profiler."
readme = "README.md"
license = "MIT"
categories = ["concurrency", "data-structures"]
keywords = ["lock-free", "spsc", "queue", "thread-local", "profiling"]

[features]
# Per-queue published/drained counters behind `EventQueueRegistry::published_prefix`.
hotpath-ordered-drain = []
# Self-profiling: instruments the drain with hotpath-meta. Not for external use.
hotpath-meta = ["dep:hotpath-meta", "hotpath-meta/hotpath-meta"]
hotpath-alloc-meta = ["hotpath-meta", "hotpath-meta/hotpath-alloc-meta"]
hotpath-cloud-meta = ["hotpath-meta", "hotpath-meta/hotpath-cloud-meta"]
hotpath-callgrind-meta = ["hotpath-meta", "hotpath-meta/hotpath-callgrind-meta"]

[dependencies]
hotpath-meta = { workspace = true, optional = true }

[lints.rust]
# `hotpath_meta::main` checks `feature = "hotpath-alloc"` in the destination
# crate; declare it so the check-cfg lint stays quiet on the examples.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("hotpath-alloc"))'] }
