[package]
name = "test-channels-ftc"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for futures channels instrumentation."

[dependencies]
hotpath = { workspace = true, features = ["futures"] }
futures-channel = "0.3"
futures-util = "0.3"
smol = "2.0"
async-io = "2.0"

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-meta = ["hotpath/hotpath-meta"]
hotpath-alloc-meta = ["hotpath-meta", "hotpath/hotpath-alloc-meta"]
