[package]
name = "test-cpu"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for CPU sampling attribution via the hotpath-cpu feature."

[dependencies]
hotpath = { workspace = true }
regex = "1"

[features]
hotpath = ["hotpath/hotpath"]
