[package]
name = "test-tokio-async"
version = "0.0.0"
publish = false
edition = "2021"
description = "Integration tests and examples using the Tokio runtime."

[dependencies]
hotpath = { path = "../hotpath", features = ["tokio"] }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1.0"
rand = "0.8"
futures-util = "0.3"
num-bigint = "0.4"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
mimalloc = { version = "0.1", optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

[features]
default = []
hotpath = ["hotpath/hotpath"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-meta = ["hotpath/hotpath-meta"]
hotpath-alloc-meta = ["hotpath-meta", "hotpath/hotpath-alloc-meta"]
dev = ["hotpath/dev"]
mimalloc-alloc = ["dep:mimalloc"]
jemalloc-alloc = ["dep:tikv-jemallocator"]

[[example]]
name = "mimalloc_allocator"
required-features = ["hotpath-alloc", "mimalloc-alloc"]

[[example]]
name = "jemalloc_allocator"
required-features = ["hotpath-alloc", "jemalloc-alloc"]
