[package]
name = "test-axum"
version = "0.0.0"
publish = false
edition = "2021"
description = "Tests for axum 0.8 server-side response time instrumentation via a tower layer."

[dependencies]
hotpath = { workspace = true, features = ["axum-0-8", "diesel", "reqwest-0-13"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
ureq = { version = "3", default-features = false }
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cloud = ["hotpath", "hotpath/hotpath-cloud"]
hotpath-prometheus = ["hotpath", "hotpath/hotpath-prometheus"]
