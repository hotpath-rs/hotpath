[workspace]
members = [
    "crates/hotpath-macros",
    "crates/hotpath",
    "crates/hotpath-drain",
    "crates/test-tokio-async",
    "crates/test-smol-async",
    "crates/test-all-features",
    "crates/test-custom-feature",
    "crates/test-channels-asc",
    "crates/test-channels-crossbeam",
    "crates/test-channels-ftc",
    "crates/test-channels-flume",
    "crates/test-channels-std",
    "crates/test-rw-lock-std",
    "crates/test-rw-lock-parking-lot",
    "crates/test-rw-lock-async-lock",
    "crates/test-rw-lock-tokio",
    "crates/test-mutex-std",
    "crates/test-mutex-parking-lot",
    "crates/test-mutex-tokio",
    "crates/test-mutex-async-lock",
    "crates/test-streams",
    "crates/test-sqlx-08",
    "crates/test-sqlx-09",
    "crates/test-reqwest-012",
    "crates/test-reqwest-013",
    "crates/test-ureq",
    "crates/test-axum",
    "crates/test-diesel",
    "crates/test-seaorm",
    "crates/test-channels-tokio",
    "crates/test-futures",
    "crates/test-io",
    "crates/test-alloc",
    "crates/test-cpu",
    "crates/test-callgrind",
    "crates/test-criterion",
    "crates/test-drain-criterion",
    "crates/test-debug",
    "crates/test-cdylib",
    "crates/test-cdylib-dep",
    "crates/hotpath-meta",
    "crates/hotpath-macros-meta",
    "crates/hotpath-drain-meta",
]
resolver = "2"
# test-toasty: toasty's rusqlite and sqlx-sqlite pull conflicting
# `links = "sqlite3"` versions. Build it via --manifest-path.
exclude = ["crates/test-toasty"]

[workspace.dependencies]
hotpath-macros = { path = "./crates/hotpath-macros", version = "0.30.1" }
hotpath-drain = { path = "./crates/hotpath-drain", version = "0.30.1" }
hotpath = { path = "./crates/hotpath", version = "0.30.1" }
hotpath-meta = { path = "./crates/hotpath-meta", version = "0.30.1" }
hotpath-macros-meta = { path = "./crates/hotpath-macros-meta", version = "0.30.1" }
hotpath-drain-meta = { path = "./crates/hotpath-drain-meta", version = "0.30.1" }
proc-macro2 = "1.0.75"
quote = "1.0.35"
syn = { version = "2.0.52", features = ["full"] }

[profile.profiling]
inherits = "release"
debug = true
