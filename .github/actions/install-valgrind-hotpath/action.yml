name: Install hotpath Valgrind
description: >-
  Installs the patched Valgrind build from hotpath-rs/valgrind (an unofficial
  fork, not affiliated with the Valgrind project) to /opt/valgrind and adds it
  to PATH. Released Valgrind misattributes inclusive instruction counts on
  aarch64; this build fixes that. The release and checksums are pinned, so a
  bump is a deliberate edit (it changes the reports' `tool`).
runs:
  using: composite
  steps:
    - name: Install hotpath Valgrind
      shell: bash
      env:
        TAG: VALGRIND_3_28_0_HOTPATH_2
        VERSION: 3.28.0.hotpath2
      run: |
        case "$(uname -m)" in
          x86_64) arch=x86_64 sum=7cdb64cf807af1aa477fd3fd18cc70d3bca42f393dce0a1435d075dbfa678408 ;;
          aarch64) arch=arm64 sum=885e56ee47ff39f986a9bc0f55057397694a046c39645c5d0cd313fb53579954 ;;
          *) echo "::error::no hotpath Valgrind build for $(uname -m)"; exit 1 ;;
        esac
        file="$RUNNER_TEMP/valgrind-$VERSION-linux-$arch.tar.zst"
        curl -fsSL --retry 3 -o "$file" \
          "https://github.com/hotpath-rs/valgrind/releases/download/$TAG/valgrind-$VERSION-linux-$arch.tar.zst"
        echo "$sum  $file" | sha256sum -c -
        sudo tar --zstd -xf "$file" -C /opt
        echo /opt/valgrind/bin >> "$GITHUB_PATH"
        test "$(/opt/valgrind/bin/valgrind --version)" = "valgrind-$VERSION"
