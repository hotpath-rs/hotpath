name: hotpath relay

# Deprecated: call the hotpath-relay action from your own relay job instead,
# see https://hotpath.rs/ci_integration ("The relay workflow"). This reusable
# workflow only wraps it, so existing callers keep working.

on:
  workflow_call:
    inputs:
      benchmark:
        description: Benchmark series to upload to, 1-64 chars from [A-Za-z0-9._-].
        required: true
        type: string
      artifact_name:
        description: Name of the artifact the benchmark job uploaded.
        default: hotpath-report
        type: string
      report_file:
        description: Name of the JSON report inside that artifact.
        default: report.json
        type: string
      source_root:
        description: >-
          Build workspace root relative to the repository root, "" when they are
          the same. Prefixes relative paths in source links.
        default: ""
        type: string

jobs:
  relay:
    name: relay ${{ inputs.benchmark }} benchmark
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The caller must grant these; a called workflow cannot raise them.
    permissions:
      actions: read # download the artifact from the benchmark run
      id-token: write # mint the token the server authenticates
      pull-requests: read # find the pull request the run belongs to
    concurrency:
      # `workflow_run.pull_requests` is empty for fork pull requests, so the fork
      # branch identifies the run instead of the pull request number.
      group: hotpath-relay-${{ inputs.benchmark }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: hotpath-rs/hotpath-relay@v1.0.0
        with:
          benchmark: ${{ inputs.benchmark }}
          artifact_name: ${{ inputs.artifact_name }}
          report_file: ${{ inputs.report_file }}
          source_root: ${{ inputs.source_root }}
