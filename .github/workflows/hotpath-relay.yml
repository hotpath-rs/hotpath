name: hotpath relay

# Uploads a hotpath report produced by a pull request job. Fork pull requests
# get no `id-token: write`, so the benchmark job saves the JSON report as an
# artifact and this workflow uploads it without checking out any PR code.
#
# Call it from a workflow of your own:
#
#   name: hotpath relay
#   on:
#     workflow_run:
#       workflows: ["<name of your benchmark workflow>"]
#       types: [completed]
#   jobs:
#     relay:
#       uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@v0.29.1
#       permissions:
#         actions: read
#         id-token: write
#         pull-requests: read
#       with:
#         benchmark: my_benchmark
#         artifact_name: hotpath-report
#         report_file: report.json
#
# The benchmark job checks out `github.event.pull_request.head.sha`, runs the
# benchmark with the `hotpath-cloud` feature, `HOTPATH_OUTPUT_FORMAT=json`,
# `HOTPATH_OUTPUT_PATH=<report_file>` and `HOTPATH_BENCHMARK=<benchmark>`, and
# uploads the file as `<artifact_name>`.
#
# `workflow_run` only runs the calling workflow from the default branch, and
# `workflows:` matches by name, so renaming the benchmark workflow silently
# stops the relay.

on:
  workflow_call:
    inputs:
      benchmark:
        description: Benchmark series to upload to, 1-64 chars from [A-Za-z0-9._-].
        required: true
        type: string
      artifact_name:
        description: Name of the artifact the benchmark job uploaded.
        default: hotpath-report
        type: string
      report_file:
        description: Name of the JSON report inside that artifact.
        default: report.json
        type: string
      source_root:
        description: >-
          Build workspace root relative to the repository root, "" when they are
          the same. Prefixes relative paths in source links.
        default: ""
        type: string

jobs:
  relay:
    name: relay ${{ inputs.benchmark }} benchmark
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The caller must grant these; a called workflow cannot raise them.
    permissions:
      actions: read # download the artifact from the benchmark run
      id-token: write # mint the token the server authenticates
      pull-requests: read # find the pull request the run belongs to
    concurrency:
      # `workflow_run.pull_requests` is empty for fork pull requests, so the fork
      # branch identifies the run instead of the pull request number.
      group: hotpath-relay-${{ inputs.benchmark }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      # Inputs reach the scripts through the environment, never interpolated
      # into the script text.
      BENCHMARK: ${{ inputs.benchmark }}
      REPORT_PATH: artifact/${{ inputs.report_file }}
      SOURCE_ROOT: ${{ inputs.source_root }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The report is written by pull request code, so nothing in it says which
      # pull request it belongs to: a report claiming another number would
      # replace that pull request's comment. The run's head commit is set by
      # GitHub, and the open pull request whose head is that commit is the one.
      # None when the branch has moved on since: the run of the newer commit
      # relays its own report.
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_LABEL: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$HEAD_LABEL" \
            --jq 'map(select(.head.sha == env.HEAD_SHA)) | first // empty' > pr.json
          if [ ! -s pr.json ]; then
            echo "::notice::no open pull request has head $HEAD_SHA, nothing to relay"
            exit 0
          fi
          echo "number=$(jq -r .number pr.json)" >> "$GITHUB_OUTPUT"

      # If this cannot find the artifact, the usual cause is a renamed benchmark
      # workflow or a mismatched artifact_name.
      - name: Download the report
        if: steps.pr.outputs.number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare the report
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          # The event is stamped, not trusted: this job's token is a
          # `workflow_run` one, which the server accepts only for a
          # `pull_request` report. The pull request fields come from the lookup
          # above. Every other key of `meta` is kept, `policy` included.
          # Compact, the form the benchmark job's size check measured.
          jq -c --arg source_root "$SOURCE_ROOT" --slurpfile pr pr.json '
            .meta.source_root = $source_root
            | .meta.ci.event = "pull_request"
            | .meta.git.base_sha = $pr[0].base.sha
            | .meta.ci.pull_request += {
                number: $pr[0].number,
                base_ref: $pr[0].base.ref,
                head_ref: $pr[0].head.ref,
                head_sha: $pr[0].head.sha
              }' "$REPORT_PATH" > upload.json

      # The server's answer is shown whatever the status: in the step summary,
      # and on one line in an `::error::` annotation when the upload was
      # rejected. On success a `comment.error` means the server could not post
      # or update the pull request comment.
      - name: Upload the report
        if: steps.pr.outputs.number
        run: |
          set -euo pipefail
          # The rewrite above added fields after the benchmark job checked the
          # size: check the body actually sent. Never truncated.
          # Keep in sync with hotpath::json::cloud_api::MAX_REPORT_BYTES.
          max_bytes=5242880
          size=$(wc -c < upload.json | tr -d ' ')
          if [ "$size" -gt "$max_bytes" ]; then
            echo "::error::the report is $size bytes, over the 5 MiB ($max_bytes bytes) limit of hotpath.rs; measure fewer functions or split the benchmark"
            exit 1
          fi
          # `ACTIONS_ID_TOKEN_REQUEST_URL` always carries an `api-version`
          # query, so the audience is appended with `&`.
          token=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hotpath.rs" | jq -er .value)
          echo "::add-mask::$token"
          if ! out=$(curl -sS -X POST https://hotpath.rs/api/v1/reports \
            --url-query "benchmark=$BENCHMARK" \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @upload.json \
            -o response.json -w '%{http_code} %header{x-request-id}'); then
            echo "::error::hotpath.rs unreachable"
            exit 1
          fi
          read -r status request_id <<< "$out"
          # A body that is not JSON is flattened by hand, so neither form can
          # start a workflow command on a line of its own.
          body=$(jq -c . response.json 2>/dev/null || head -c 2000 response.json | tr '\r\n' '  ')
          {
            echo "## hotpath.rs $BENCHMARK benchmark"
            echo "HTTP $status, request ${request_id:--}"
            echo '```'; jq . response.json 2>/dev/null || cat response.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 201 ] && [ "$status" != 200 ]; then
            echo "::error::hotpath.rs rejected the report (HTTP $status): $body"
            exit 1
          fi
          comment_error=$(jq -r '.comment.error // empty' response.json 2>/dev/null | tr '\r\n' '  ' || true)
          if [ -n "$comment_error" ]; then
            echo "::warning::hotpath.rs comment failed: $comment_error"
          fi
