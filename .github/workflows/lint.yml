name: Rust Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint stable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-hack
      - name: Fmt
        run: |
          cargo fmt --all --check
      - name: Lint (default features)
        run: |
          cargo clippy --all --features hotpath -- -D warnings
      - name: Lint (--all-features)
        run: |
          cargo clippy --all --all-features -- -D warnings
      - name: Doc (docs.rs features)
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc -p hotpath --no-deps --features hotpath,hotpath-alloc
      - name: Lint (hotpath-alloc)
        run: |
          cargo clippy --all --features "hotpath,hotpath-alloc" -- -D warnings
      - name: Lint custom features combination
        run: |
          cargo clippy -p test-custom-feature --features hotpath-profile --all-targets -- -D warnings
      - name: Lint feature matrix without hotpath (cargo-hack each-feature)
        run: |
          cargo hack clippy -p hotpath \
            --each-feature \
            --exclude-features hotpath-meta,hotpath-alloc-meta,hotpath-mcp-meta,hotpath-prometheus-meta,hotpath-cloud-meta,dev,tui,cloud \
            -- -D warnings
      - name: Lint feature matrix (cargo-hack each-feature)
        run: |
          cargo hack clippy -p hotpath --features hotpath,threads \
            --each-feature \
            --exclude-features default,hotpath-meta,hotpath-alloc-meta,hotpath-mcp-meta,hotpath-prometheus-meta,dev,tui,cloud \
            -- -D warnings
      - name: Audit
        run: |
          cargo audit --ignore RUSTSEC-2023-0071
