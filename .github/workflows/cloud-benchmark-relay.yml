name: Cloud benchmark relay

on:
  workflow_run:
    workflows: ["Cloud random benchmark", "Cloud drain benchmark", "Cloud meta benchmark", "Cloud drain criterion benchmark"]
    types: [completed]

permissions: {}

# Uploads the `hotpath-report` artifact of each benchmark's pull request run
# through the hotpath-relay action. The series is looked up from the workflow
# name, so keep the lookup in sync with `workflows:`.
jobs:
  relay:
    # The drain criterion benchmark uploads same-repository pull requests in
    # process and writes an artifact only for forks.
    if: >-
      github.event.workflow_run.name != 'Cloud drain criterion benchmark' ||
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    steps:
      - uses: hotpath-rs/hotpath-relay@v1.0.0
        with:
          benchmark: ${{ fromJSON('{"Cloud random benchmark":"random","Cloud drain benchmark":"drain","Cloud meta benchmark":"meta","Cloud drain criterion benchmark":"drain-criterion"}')[github.event.workflow_run.name] }}
