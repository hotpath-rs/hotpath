name: Cloud drain benchmark relay

on:
  workflow_run:
    workflows: ["Cloud drain benchmark"]
    types: [completed]

# Uploads the merged report every pull request run of `cloud-drain-benchmark.yml`
# stores as an artifact (fork PRs get no OIDC token). Called like
# `cloud-random-benchmark-relay.yml`, from `@main`.
jobs:
  relay:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@main
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: drain
      artifact_name: drain-report
      report_file: merged.json
