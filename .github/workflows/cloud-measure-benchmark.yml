name: Cloud measure benchmark

on:
  push:
    branches: [main]
    # Changes only to these paths cannot affect the build, so they skip CI.
    paths-ignore: &paths-ignore
      - "**.md"
      - "docs/**"
      - "dev_docs/**"
      - "dev_skills/**"
      - "skills/**"
      - "media/**"
      - "LICENSE.txt"
      - "cliff.toml"
      - "context7.json"
  pull_request:
    paths-ignore: *paths-ignore

# Per-call cost of `#[hotpath::measure]` for every function shape:
# `benchmark_measure` calls each shape a fixed number of times from a driver
# function that `hotpath-meta` measures, so the code the macro emits into the
# measured function shows up in the drivers' instruction counts.
#
# One build runs twice: natively for timing, then under Valgrind Callgrind,
# which merges the native report into its own (`HOTPATH_META_MERGE_REPORT`).
# A failed merge or upload fails the job. Findings are reported on the pull
# request's `hotpath / measure` check run (`hotpath/measure-policy.toml`).
#
# Pushes upload in process with the job's OIDC token. Fork PRs get no
# `id-token: write`, so pull requests write the merged report to an artifact
# and `cloud-benchmark-relay.yml` uploads it.
jobs:
  upload:
    name: cloud measure benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_META_BENCHMARK: measure
      HOTPATH_META_EXCLUDE_WRAPPER: "true"
      HOTPATH_OUTPUT_FORMAT: none
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-measure-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build measure benchmark
        run: |
          cargo build -q --release -p test-all-features --example benchmark_measure \
            --features hotpath,hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run measure benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/benchmark_measure
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one; the `jq` check fails a report that is not a merged one.
      - name: Run measure benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            target/release/examples/benchmark_measure
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null

  report:
    name: cloud measure benchmark (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HOTPATH_META_BENCHMARK: measure
      HOTPATH_META_EXCLUDE_WRAPPER: "true"
      HOTPATH_OUTPUT_FORMAT: none
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-measure-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build measure benchmark
        run: |
          cargo build -q --release -p test-all-features --example benchmark_measure \
            --features hotpath,hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run measure benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/benchmark_measure
      # A failed merge fails the job before the artifact upload, so the relay
      # never posts a report that is not merged.
      - name: Run measure benchmark under Callgrind and write the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: report.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            target/release/examples/benchmark_measure
          test -s report.json
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: hotpath-report
          path: report.json
          retention-days: 1
          if-no-files-found: error
