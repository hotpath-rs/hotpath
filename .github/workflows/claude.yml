name: Claude

# Runs Claude Code on a pull request or issue when the repository owner
# mentions `@claude` in a comment or review. Mention-only by design: nothing
# runs on push or on PR open, and comments from anyone but the owner are
# ignored so the token cannot be spent by fork authors. `@claude review`
# reviews the pull request and posts inline findings.
#
# Authentication is `CLAUDE_CODE_OAUTH_TOKEN`, a repository secret created
# with `claude setup-token`, so runs draw on the account's Claude plan rather
# than API billing.
#
# Comment-triggered workflows always run the copy on the default branch, so
# this file does nothing until it is merged.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        github.event.review.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a review, then a video when it is worth one
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-code.git
            https://github.com/bisque-cloud/presenter.git
          plugins: |
            code-review@claude-code-plugins
            presenter@bisque-cloud
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --allowedTools "Skill,Write,Edit,WebFetch,Bash(node:*),Bash(mkdir:*)"
            --append-system-prompt "When you are asked to review or explain a pull request, after you have answered, decide whether it is worth a short video for someone who did not write it: yes for a design decision, a new command or option, a migration, or a change where the reasoning matters more than the diff; no for a dependency bump, formatting, a typo or a small fix. If it is, use the present skill from the presenter plugin to make a presentation of the pull request from what you have already read: what it changes, why, and what a reviewer should look at. Write index.html, context.md, assets/ and title.txt (one line, the title) to ${{ runner.temp }}/explainer. Run the skill's plan, pronunciation-report and narrate with --voice kokoro:af_heart and fix what they report. Do not run login or publish: the next step of this job publishes the folder and comments the link. If it is not worth a video, write nothing there."

      # Publishes the presentation the session above wrote, as this
      # repository, to its bisque.today channel, and comments the link on the
      # pull request. A separate step because claude-code-action keeps the
      # token that publishes away from Claude's session. No folder, no publish.
      - name: Check for a presentation
        id: explainer
        run: |
          if [ -f "$RUNNER_TEMP/explainer/index.html" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the presentation
        if: steps.explainer.outputs.ready == 'true'
        continue-on-error: true
        uses: bisque-cloud/presenter@v1
        with:
          source: pull-request
          presentation: ${{ runner.temp }}/explainer
