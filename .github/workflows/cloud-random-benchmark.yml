name: Cloud random benchmark

on:
  workflow_dispatch:

# Synthetic benchmark for checking PR comment correctness: `benchmark_random`
# touches every resource type the comment policy judges and on each run
# randomly makes every resource 3x slower (or not), so every comment carries a
# known mix of regressions and improvements. The draw is attached to the report
# as `user_metadata`. Uploaded to the separate `random` series.
#
# The results are noisy, so it runs only when triggered manually and uploads
# in process with the job's OIDC token.
jobs:
  upload:
    name: cloud random benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-random-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block, and with
      # `fail-on-error` a failed upload exits 1. The response file exists only
      # after an accepted upload, so `test -s` also fails a skipped one. No
      # `pr_check` in its policy: this benchmark regresses by design.
      - name: Run random benchmark and upload report
        env:
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_BENCHMARK: random
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release
          HOTPATH_EXCLUDE_WRAPPER: "true"
          HOTPATH_OUTPUT_FORMAT: none
        run: |
          cargo run -q --release -p test-axum --example benchmark_random \
            --features hotpath-alloc,hotpath-cloud
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
      # The file exists only when the report was uploaded: a failed or skipped
      # upload has no verdict.
      - name: Print the verdict
        if: always()
        run: |
          if [ -s upload-response.json ]; then
            jq '{verdict, dashboard_url}' upload-response.json
          else
            echo "no upload response, so no verdict"
          fi

