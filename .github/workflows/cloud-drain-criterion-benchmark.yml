name: Cloud drain criterion benchmark

# Every push to `main` and every pull request push runs on the Hetzner
# bare-metal runner, including empty commits, so repeated runs sample the
# machine's run-to-run variability. All benchmarks are built first, then run
# one after the other in one job, and the concurrency group keeps one job at a
# time on the machine.
on:
  push:
    branches: [main]
  pull_request:

# The `drain` lockstep scenario as a Criterion benchmark (`test-drain-criterion`),
# profiled by `hotpath-meta` with a fixed iteration count. One build runs twice
# through `cargo bench`: natively for timing, then under Valgrind Callgrind as
# Cargo's runner, which merges the native report into its own. A regression fails
# the `hotpath / drain-criterion-hetzner` check run, not the job. Then the
# single-threaded `fib` benchmark runs natively only: its instruction count is
# deterministic, and its timing spread is the control for `drain`'s. Last, the
# `brrr` One Billion Row Challenge solution (`test-brrr-criterion`, nightly,
# source fetched from jonhoo/brrr) runs natively: parallel work with little
# cross-thread communication. Reports upload in process with the job's OIDC
# token.
jobs:
  hetzner:
    name: cloud criterion benchmarks (hetzner)
    # Fork pull requests get no OIDC token, so they cannot upload. This is not a
    # security boundary: a fork can edit this file, so fork workflow runs must
    # stay behind manual approval while a self-hosted runner is registered.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, hetzner]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # One benchmark at a time on the Hetzner machine.
    concurrency:
      group: hetzner-bare-metal
      cancel-in-progress: false
    # Shared by both `drain` runs, so their reports describe one benchmark; the
    # `fib` and `brrr` steps override the benchmark name and policy.
    env:
      # Its own series, so it never shares a baseline with GitHub-hosted runs;
      # the policy path keeps the drain criterion policy.
      HOTPATH_META_BENCHMARK: drain-criterion-hetzner
      HOTPATH_META_POLICY_PATH: ${{ github.workspace }}/hotpath/drain-criterion-policy.toml
      HOTPATH_META_OUTPUT_FORMAT: json
      HOTPATH_META_CRITERION_ITERATIONS: 5
      # Identical features in every `cargo bench`, so all runs use the one build.
      BENCH_ARGS: -p test-drain-criterion --bench drain --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      FIB_ARGS: -p test-drain-criterion --bench fib --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      BRRR_ARGS: --manifest-path crates/test-brrr-criterion/Cargo.toml --bench brrr --features hotpath-alloc-meta,hotpath-cloud-meta
      # brrr's own build flags; identical in its build and run, so it builds once.
      BRRR_RUSTFLAGS: -Ctarget-cpu=native
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped. Self-hosted
        # runners have no image variables, so the runner name and OS stand in.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=$RUNNER_NAME-ubuntu$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"
      # The runner has no sudo, so the hotpath-rs Valgrind build
      # (unofficial fork, hotpath-rs/valgrind) is preinstalled at /opt/valgrind.
      - name: Use the preinstalled Valgrind
        run: |
          test "$(/opt/valgrind/bin/valgrind --version)" = valgrind-3.28.0.hotpath-rs-2
          echo /opt/valgrind/bin >> "$GITHUB_PATH"
      # The machine persists between runs: do not benchmark while package
      # maintenance or a RAID check runs on it.
      - name: Check the bare-metal host is idle
        run: |
          if systemctl is-active --quiet apt-daily.service apt-daily-upgrade.service; then
            echo "::error::APT maintenance is running on the runner host"
            exit 1
          fi
          if grep -qE '(resync|check|recovery) *=' /proc/mdstat; then
            echo "::error::a RAID resync or check is running on the runner host"
            exit 1
          fi
      - name: Build criterion benchmarks
        id: build
        run: |
          cargo bench $BENCH_ARGS --no-run
          cargo bench $FIB_ARGS --no-run
      # Nightly is installed next to stable without becoming the default, so
      # the other benchmarks stay on stable.
      - name: Fetch and build brrr criterion benchmark
        id: build_brrr
        if: ${{ !cancelled() }}
        env:
          RUSTFLAGS: ${{ env.BRRR_RUSTFLAGS }}
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          echo "version=$(rustc +nightly --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          crates/test-brrr-criterion/fetch.sh
          cargo +nightly bench $BRRR_ARGS --no-run
      # Cargo starts the benchmark in the package directory; hotpath finds the
      # git root above it. No upload: this report is merged into the Callgrind
      # run's.
      - name: Run drain criterion benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=bench,valgrind=3.28.0.hotpath-rs-2
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: cargo bench $BENCH_ARGS -- --test --exact drain/lockstep
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one; the `jq` check fails a report that is not a merged one.
      - name: Run drain criterion benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=bench,valgrind=3.28.0.hotpath-rs-2
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file=${{ runner.temp }}/callgrind.out.%p
        run: |
          cargo bench $BENCH_ARGS -- --test --exact drain/lockstep
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and .meta.criterion.benchmark == "drain/lockstep"' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
      # Runs even when `drain` failed, so every sample has its control.
      - name: Run fib criterion benchmark natively and upload the report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HOTPATH_META_BENCHMARK: fib-criterion-hetzner
          HOTPATH_META_POLICY_PATH: ${{ github.workspace }}/hotpath/fib-criterion-policy.toml
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=bench
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/fib-upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/fib.json
        run: |
          cargo bench $FIB_ARGS -- --test --exact fib/recursive
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '(.functions_timing.data | length > 0) and .meta.criterion.benchmark == "fib/recursive"' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
      - name: Run brrr criterion benchmark natively and upload the report
        if: ${{ !cancelled() && steps.build_brrr.outcome == 'success' }}
        env:
          RUSTFLAGS: ${{ env.BRRR_RUSTFLAGS }}
          HOTPATH_META_BENCHMARK: brrr-criterion-hetzner
          HOTPATH_META_POLICY_PATH: ${{ github.workspace }}/hotpath/brrr-criterion-policy.toml
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=nightly,rustc=${{ steps.build_brrr.outputs.version }},profile=bench
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/brrr-upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/brrr.json
        run: |
          cargo +nightly bench $BRRR_ARGS -- --test --exact brrr/rows
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '(.functions_timing.data | length > 0) and .meta.criterion.benchmark == "brrr/rows"' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
