name: Cloud random benchmark relay

on:
  workflow_run:
    workflows: ["Cloud random benchmark"]
    types: [completed]

# This repo is the first consumer of its own relay: `hotpath-relay.yml` is the
# reusable workflow adopters call. Referenced by full path rather than `./` so
# this call resolves exactly the way an adopter's does, and `@main` so the relay
# under test is the one on the default branch.
jobs:
  relay:
    uses: hotpath-rs/hotpath/.github/workflows/hotpath-relay.yml@main
    permissions:
      actions: read
      id-token: write
      pull-requests: read
    with:
      benchmark: random
      artifact_name: random-report
      report_file: random-report.json
