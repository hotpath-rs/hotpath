name: Cloud meta benchmark

on:
  push:
    branches: [main]
  pull_request:

# Self-benchmark of the profiler: `benchmark_meta` drives every instrumented
# subsystem a fixed number of times while `hotpath-meta` profiles hotpath's own
# hot paths.
#
# One build runs twice: natively for timing (and every other native section),
# then under Valgrind Callgrind, which merges the native report into its own
# (`HOTPATH_META_MERGE_REPORT`) and uploads one report carrying both timing
# and instruction counts. Pushes upload in process with the job's OIDC token,
# and a failed merge or upload fails the job. Fork PRs get no
# `id-token: write`, so every pull request writes the merged report to an
# artifact and `cloud-meta-benchmark-relay.yml` uploads it. A regression fails
# the pull request's `hotpath / meta` check run (`pr_check` in
# `hotpath/meta-policy.toml`), not the job.
jobs:
  benchmark:
    name: cloud meta benchmark
    # Instruction counts depend on the Valgrind build, and reports only compare
    # within one (`tool`), so the image and the package are pinned: an upgrade
    # is a deliberate bump, not a silent gap in verdicts.
    runs-on: ubuntu-26.04
    # Callgrind runs the whole benchmark tens of times slower than natively.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_META_BENCHMARK: meta
      HOTPATH_META_EXCLUDE_WRAPPER: "true"
      HOTPATH_OUTPUT_FORMAT: none
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build meta benchmark
        run: |
          cargo build -q --release -p test-all-features --example benchmark_meta \
            --features hotpath-alloc,hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta,hotpath-prometheus
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run meta benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/benchmark_meta
      # Only pushes upload (an empty HOTPATH_META_UPLOAD is off). The uploader
      # reports its own outcome: one `::notice::` / `::warning::` / `::error::`
      # annotation plus a step summary block. The response file exists only
      # after an accepted upload, so `test -s` also fails a skipped one; the
      # `jq` check fails a report that is not a merged one, before a pull
      # request stores it for the relay.
      - name: Run meta benchmark under Callgrind and write the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_UPLOAD: ${{ github.event_name == 'push' && 'fail-on-error' || '' }}
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            target/release/examples/benchmark_meta
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          fi
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: meta-report
          path: ${{ runner.temp }}/merged.json
          retention-days: 1
          if-no-files-found: error
