name: Cloud meta benchmark

on:
  push:
    branches: [main]
  pull_request:

# Self-benchmark of the profiler: `benchmark_meta` drives every instrumented
# subsystem a fixed number of times while `hotpath-meta` profiles hotpath's own
# hot paths.
#
# Pushes and pull requests upload in process with the job's OIDC token, and a
# failed upload fails the job. A regression fails the pull request's
# `hotpath / meta` check run (`pr_check` in
# `hotpath/meta-policy.toml`), not the job. The job is skipped for fork pull
# requests.
jobs:
  benchmark:
    name: cloud meta benchmark
    # Fork pull requests get no `id-token: write`, so there is nothing to upload.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The exact compiler goes into the report's metadata: `stable` moves, and
      # a new rustc changes what a benchmark measures.
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one.
      - name: Run meta benchmark and upload report
        env:
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_BENCHMARK: meta
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release
          HOTPATH_META_EXCLUDE_WRAPPER: "true"
          HOTPATH_META_OUTPUT_FORMAT: none
          HOTPATH_OUTPUT_FORMAT: none
        run: |
          cargo run -q --release -p test-all-features --example benchmark_meta \
            --features hotpath,hotpath-alloc,hotpath-meta,hotpath-alloc-meta,hotpath-cloud-meta,hotpath-prometheus
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
