name: Cloud drain benchmark

on:
  push:
    branches: [main]
  pull_request:

# Transport-layer benchmark: the `hotpath-drain` `throughput` example runs
# several producer threads against one consumer while `hotpath-meta` profiles
# the queue's own hot paths (`push`, `sweep`, `drain_into`). One build runs
# twice: natively for timing (and every other native section), then under
# Valgrind Callgrind, which merges the native report into its own
# (`HOTPATH_META_MERGE_REPORT`) and uploads one report carrying both timing and
# instruction counts to the separate `drain` series. A regression fails the
# pull request's `hotpath / drain` check run (`pr_check` in
# `hotpath/drain-policy.toml`), not the job.
#
# Pushes upload in process with the job's OIDC token. Fork PRs get no
# `id-token: write`, so every pull request writes the merged report to an
# artifact and `cloud-drain-benchmark-relay.yml` uploads it.
jobs:
  benchmark:
    name: cloud drain benchmark
    # Instruction counts depend on the Valgrind build, and reports only compare
    # within one (`tool`), so the image and the package are pinned: an upgrade
    # is a deliberate bump, not a silent gap in verdicts.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_META_BENCHMARK: drain
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build drain benchmark
        run: |
          cargo build -q --release -p hotpath-drain --example throughput \
            --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run drain benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/throughput
      # The Callgrind dump goes to the runner's temp dir, named for hotpath-meta
      # by HOTPATH_META_CALLGRIND_OUT_FILE. Only pushes upload (an empty
      # HOTPATH_META_UPLOAD is off); their response file exists only after an
      # accepted upload. The `jq` check fails a report that is not a merged
      # one, before a pull request stores it for the relay.
      - name: Run drain benchmark under Callgrind and write the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_UPLOAD: ${{ github.event_name == 'push' && 'fail-on-error' || '' }}
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            target/release/examples/throughput
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          fi
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: drain-report
          path: ${{ runner.temp }}/merged.json
          retention-days: 1
          if-no-files-found: error
