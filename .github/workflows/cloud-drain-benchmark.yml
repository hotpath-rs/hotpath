name: Cloud drain benchmark

on:
  push:
    branches: [main]
  pull_request:

# Transport-layer benchmark: the `hotpath-drain` `throughput` example runs
# several producer threads against one consumer while `hotpath-meta` profiles
# the queue's own hot paths (`push`, `sweep`, `drain_into`). One build runs
# twice: natively for timing (and every other native section), then under
# Valgrind Callgrind, which merges the native report into its own
# (`HOTPATH_META_MERGE_REPORT`): one report carrying both timing and
# instruction counts in the separate `drain` series. A regression fails the
# pull request's `hotpath / drain` check run (`pr_check` in
# `hotpath/drain-policy.toml`), not the job.
#
# Pushes upload in process with the job's OIDC token: the push baseline.
# Pull requests, forks and same-repository ones alike, run
# `cloud-paired-benchmark.yml`: the base and head commits measured in one job
# on one runner. Its two reports reach hotpath-cloud as one same-runner pair
# through `cloud-benchmark-relay.yml`, which verifies the baseline first and
# otherwise relays the head alone against the push baseline.
jobs:
  upload:
    name: cloud drain benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_META_BENCHMARK: drain
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-drain-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
          valgrind --version
      - name: Build drain benchmark
        run: |
          cargo build -q --release -p hotpath-drain --example throughput \
            --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run drain benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/throughput
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one; the `jq` check fails a report that is not a merged one.
      - name: Run drain benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.26.0
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            target/release/examples/throughput
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null

  paired:
    name: cloud drain benchmark (pull request)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # A newer commit of the pull request supersedes a running benchmark; the
    # relay skips a cancelled run.
    concurrency:
      group: drain-benchmark-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/cloud-paired-benchmark.yml
    with:
      benchmark: drain
      runs-on: ubuntu-26.04
      # Both revisions, each natively and under Callgrind.
      timeout-minutes: 40
      prefix: HOTPATH_META
      valgrind: apt
      valgrind-version: 3.26.0
      profile: release
      build: >-
        cargo build -q --release -p hotpath-drain --example throughput --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
      run: target/release/examples/throughput
      callgrind: >-
        valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file="$CALLGRIND_OUT" target/release/examples/throughput
      check: >-
        .meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0)
