name: Cloud dedup benchmark

on:
  push:
    branches: [main]
  pull_request:

# The `test-dedup` `dedup` example. One build runs twice: natively for timing
# and allocations, then under Valgrind Callgrind, which merges the native
# report into its own.
#
# Pushes upload in process with the job's OIDC token: the push baseline.
# Pull requests, forks and same-repository ones alike, run
# `cloud-paired-benchmark.yml`: the base and head commits measured in one job
# on one runner. Its two reports reach hotpath-cloud as one same-runner pair
# through `cloud-benchmark-relay.yml`, which verifies the baseline first and
# otherwise relays the head alone against the push baseline.
jobs:
  upload:
    name: cloud dedup benchmark (push)
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_BENCHMARK: dedup
      HOTPATH_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-dedup-benchmark
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Released Valgrind misattributes inclusive instruction counts on arm64;
      # this build fixes it (unofficial fork, hotpath-rs/valgrind).
      - uses: hotpath-rs/setup-valgrind@v1.1.0
        with:
          version: 3.28.0.hotpath-rs-2
      - name: Build dedup benchmark
        run: |
          cargo build -q --release -p test-dedup --example dedup \
            --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run dedup benchmark natively
        env:
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.28.0.hotpath-rs-2
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: target/release/examples/dedup
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one; the `jq` check fails a report that is not a merged one.
      - name: Run dedup benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.28.0.hotpath-rs-2
          HOTPATH_UPLOAD: fail-on-error
          HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
            target/release/examples/dedup
          test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and (.functions_alloc.data | length > 0)' \
            "$HOTPATH_OUTPUT_PATH" > /dev/null

  paired:
    name: cloud dedup benchmark (pull request)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    # A newer commit of the pull request supersedes a running benchmark; the
    # relay skips a cancelled run.
    concurrency:
      group: dedup-benchmark-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/cloud-paired-benchmark.yml
    with:
      benchmark: dedup
      runs-on: ubuntu-26.04-arm
      # Both revisions, each natively and under Callgrind.
      timeout-minutes: 40
      prefix: HOTPATH
      valgrind: hotpath-rs
      valgrind-version: 3.28.0.hotpath-rs-2
      profile: release
      build: >-
        cargo build -q --release -p test-dedup --example dedup --features hotpath-alloc,hotpath-cloud,hotpath-callgrind
      run: target/release/examples/dedup
      callgrind: >-
        valgrind -q --tool=callgrind --instr-atstart=no --callgrind-out-file="$CALLGRIND_OUT" target/release/examples/dedup
      check: >-
        .meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and (.functions_alloc.data | length > 0)
