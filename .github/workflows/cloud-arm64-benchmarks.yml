name: Cloud ARM64 benchmarks

on:
  push:
    branches: [main]
  pull_request:

# The Callgrind benchmarks of `cloud-meta-benchmark.yml`,
# `cloud-drain-benchmark.yml` and `cloud-drain-criterion-benchmark.yml`, run
# the same way on ARM64 and uploaded as separate `<benchmark>-arm64` series
# with the same policies, to compare ARM64 run-to-run variance with x86_64.
#
# Released Valgrind misattributes inclusive instruction counts on aarch64, so
# this uses the patched build from hotpath-rs/valgrind, installed by
# hotpath-rs/setup-valgrind.
#
# Pushes and same-repository pull requests upload in process with the job's
# OIDC token. Fork pull requests are skipped: they have no token, and the relay
# only knows the x86_64 series.
jobs:
  upload:
    name: cloud ${{ matrix.benchmark }} benchmark (arm64)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Pinned like the x86_64 jobs: the image here, the Valgrind build in
    # the setup-valgrind step.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - benchmark: meta
            timeout: 60
            # Lines appended to $GITHUB_ENV, as the x86_64 job sets them.
            env: |
              HOTPATH_META_EXCLUDE_WRAPPER=true
              HOTPATH_OUTPUT_FORMAT=none
            build: |
              cargo build -q --release -p test-all-features --example benchmark_meta \
                --features hotpath-alloc,hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta,hotpath-prometheus
              echo "bin=target/release/examples/benchmark_meta" >> "$GITHUB_OUTPUT"
            args: ""
            check: ""
          - benchmark: drain
            timeout: 20
            env: ""
            build: |
              cargo build -q --release -p hotpath-drain --example throughput \
                --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta
              echo "bin=target/release/examples/throughput" >> "$GITHUB_OUTPUT"
            args: ""
            check: ""
          - benchmark: drain-criterion
            timeout: 20
            env: |
              HOTPATH_META_CRITERION_ITERATIONS=5
            build: |
              bin=$(cargo build -q --release -p test-drain-criterion --bench drain \
                --features hotpath-alloc-meta,hotpath-cloud-meta,hotpath-callgrind-meta \
                --message-format=json \
                | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | index("bench"))) | .executable')
              test -x "$bin"
              echo "bin=$bin" >> "$GITHUB_OUTPUT"
            args: --bench --test --exact drain/lockstep
            check: and .meta.criterion.benchmark == "drain/lockstep"
    # Shared by both runs, so their reports describe one benchmark.
    env:
      HOTPATH_META_BENCHMARK: ${{ matrix.benchmark }}-arm64
      HOTPATH_META_POLICY_PATH: hotpath/${{ matrix.benchmark }}-policy.toml
      HOTPATH_META_OUTPUT_FORMAT: json
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's head commit, not the default merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set benchmark environment
        env:
          LINES: ${{ matrix.env }}
        run: printf '%s' "$LINES" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Record rustc version
        id: rustc
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Record runner CPU and image
        id: host
        # Commas would split the user metadata, so they are stripped.
        run: |
          echo "cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1 | tr -d ',')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-${{ matrix.benchmark }}
      - uses: hotpath-rs/setup-valgrind@e1c12b506ae734664763825284659df81f67ef14 # main
        with:
          version: 3.28.0.hotpath-rs
      - name: Build ${{ matrix.benchmark }} benchmark
        id: build
        run: ${{ matrix.build }}
      # Run from the workspace root (git info, policy lookup). No upload: this
      # report is merged into the Callgrind run's.
      - name: Run ${{ matrix.benchmark }} benchmark natively
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.28.0.hotpath-rs
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/native.json
        run: ${{ steps.build.outputs.bin }} ${{ matrix.args }}
      # The uploader reports its own outcome: one `::notice::` / `::warning::`
      # / `::error::` annotation plus a step summary block. The response file
      # exists only after an accepted upload, so `test -s` also fails a
      # skipped one; the `jq` check fails a report that is not a merged one.
      - name: Run ${{ matrix.benchmark }} benchmark under Callgrind and upload the merged report
        env:
          HOTPATH_META_USER_METADATA: runner=${{ runner.os }}-${{ runner.arch }},cpu=${{ steps.host.outputs.cpu }},image=${{ steps.host.outputs.image }},toolchain=stable,rustc=${{ steps.rustc.outputs.version }},profile=release,valgrind=3.28.0.hotpath-rs
          HOTPATH_META_UPLOAD: fail-on-error
          HOTPATH_META_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload-response.json
          HOTPATH_META_OUTPUT_PATH: ${{ runner.temp }}/merged.json
          HOTPATH_META_MERGE_REPORT: ${{ runner.temp }}/native.json
          HOTPATH_META_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
        run: |
          valgrind -q --tool=callgrind --instr-atstart=no \
            --callgrind-out-file="$HOTPATH_META_CALLGRIND_OUT_FILE" \
            ${{ steps.build.outputs.bin }} ${{ matrix.args }}
          test -s "$HOTPATH_META_UPLOAD_RESPONSE_PATH"
          jq -e '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) ${{ matrix.check }}' \
            "$HOTPATH_META_OUTPUT_PATH" > /dev/null
