# Runs the hotpath-drain tests under miri to check the crate's unsafe code
# (uninitialized reads, chunk ownership, data races) against Rust's rules.

name: Miri

on:
  push:
    branches: [main]
    # Changes only to these paths cannot affect the build, so they skip CI.
    paths-ignore: &paths-ignore
      - "**.md"
      - "docs/**"
      - "dev_docs/**"
      - "dev_skills/**"
      - "skills/**"
      - "media/**"
      - "LICENSE.txt"
      - "cliff.toml"
      - "context7.json"
  pull_request:
    paths-ignore: *paths-ignore

jobs:
  miri:
    name: miri hotpath-drain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run miri
        run: cargo +nightly miri test -p hotpath-drain
